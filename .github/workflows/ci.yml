name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip the changesets release PRs (branch changeset-release/*): they only
    # bump versions and CHANGELOGs, no source change, and their merge to main
    # is rebuilt, typechecked, and tested by release.yml before publishing.
    # Feature PRs and pushes to main/dev still run.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck
      - run: pnpm typecheck:recipes

      - run: pnpm test
