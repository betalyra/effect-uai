name: Release

on:
  # main: stable release. dev: `@dev` snapshot (same file because npm trusted
  # publishing is bound to `release.yml`).
  push:
    branches: [main, dev]
  # Manual re-run (e.g. to finish a partial publish). With no changesets on
  # main it runs the publish path; `changeset publish` skips already-published
  # versions and pushes only the missing ones. On dev: forces a snapshot.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A newer dev push supersedes a running snapshot; stable releases never cancel.
  cancel-in-progress: ${{ github.ref == 'refs/heads/dev' }}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing requires npm >= 11.5.1. Node 24 ships
      # npm 11 by default, but pin explicitly so we don't regress if the
      # Node minor changes underneath us.
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      # Trusted publishing via OIDC (configured per package on npmjs.com).
      # When changesets are present -> opens/updates the release PR.
      # When merged (no changesets remain) -> runs `pnpm release`, which
      # publishes via OIDC; no NPM_TOKEN, no OTP.
      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore: release"
          title: "chore: release"
          # Per-package tag/release creation is off because (a) we ship
          # every package at the same version and want a single
          # `v<version>` tag + one combined GitHub Release, and (b) the
          # action's post-publish step has been known to hang on OIDC
          # publishes. The next step handles tags + release via
          # `scripts/tag-and-release.sh`.
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Same script the manual `tag-and-release.yml` workflow uses, so
      # the auto and manual paths produce identical artifacts.
      #
      # Deliberately NOT guarded on `steps.changesets.outputs.published`.
      # That output comes from the action's post-publish phase, which has
      # hung on OIDC publishes (0.13.0 published fine, then emitted no
      # output, so the guard skipped this step and the release was lost).
      # The script is idempotent: it exits 0 when the tag already exists,
      # and fails loudly on version drift, so running it unconditionally
      # is safe. On a release-PR run the version is unchanged and the tag
      # already exists, so it no-ops. No `if:` at all, so it inherits the
      # default `success()`: runs whenever every earlier step passed.
      - name: Create v<version> tag and combined GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/tag-and-release.sh

  # Pushes that touch no published code (docs, plans, recipes, webpage) skip.
  # Without pending changesets there is nothing to version.
  dev-gate:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: gate
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          if ! ls .changeset/*.md | grep -qv README.md; then
            echo "No pending changesets"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$EVENT" != push ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(packages/|\.changeset/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "No package changes"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  # Snapshot of dev as `X.Y.Z-dev-<datetime>` on the `dev` dist-tag. Versions
  # are rewritten only in this checkout: nothing is committed or tagged, and
  # `latest` is untouched.
  dev-snapshot:
    needs: dev-gate
    if: needs.dev-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm changeset version --snapshot dev

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm changeset publish --tag dev --no-git-tag
