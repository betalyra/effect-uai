<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>effect-uai · direct chat</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        max-width: 720px;
        margin: 2rem auto;
        padding: 0 1.5rem;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.4rem;
        margin-bottom: 0.25rem;
      }
      p.hint {
        opacity: 0.7;
        margin-top: 0;
      }
      #log {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        min-height: 12rem;
        max-height: 60vh;
        overflow-y: auto;
        margin: 1.5rem 0;
      }
      .user,
      .assistant {
        padding: 0.6rem 0.9rem;
        border-radius: 10px;
        white-space: pre-wrap;
      }
      .user {
        align-self: flex-end;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .assistant {
        align-self: flex-start;
        border: 1px solid color-mix(in srgb, currentColor 20%, transparent);
      }
      small {
        display: block;
        opacity: 0.6;
        margin-top: 0.25rem;
      }
      form {
        display: flex;
        gap: 0.5rem;
      }
      input {
        flex: 1;
        font: inherit;
        padding: 0.5rem 0.75rem;
        border-radius: 8px;
        border: 1px solid currentColor;
        background: transparent;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        border: 1px solid currentColor;
        background: transparent;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Direct chat</h1>
    <p class="hint">
      One request per message. The server remembers the chat; reload for a new one.
    </p>
    <div id="log"></div>
    <form id="form">
      <input id="prompt" placeholder="Ask anything" autocomplete="off" autofocus />
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
    <script type="module" src="/client.js"></script>
  </body>
</html>
